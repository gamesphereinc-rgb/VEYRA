name: Windows build

on:
  # Only browser/build changes should trigger the expensive Windows + CEF job.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - CMakeLists.txt
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tools/**'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'
  # Validate browser changes before they are merged into main.
  pull_request:
    branches: [main]
    paths:
      - CMakeLists.txt
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tools/**'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'
  # Use workflow_dispatch for a deliberate manual build or stable release from main.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional stable release tag to publish from main (for example v0.4.1). Leave blank for a test build only."
        required: false
        type: string

concurrency:
  group: veyra-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Dependabot action-version PRs do not change VEYRA itself.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Inno Setup
        shell: powershell
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup 6 compiler was not found."
          }

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Restore verified minimal CEF cache
        id: cef-cache
        uses: actions/cache/restore@v5
        with:
          path: third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64_minimal
          key: cef-windows-x64-minimal-154.0.34-g14c5a08-chromium-154.0.8037.98

      - name: Download, verify, and extract minimal CEF
        id: cef-setup
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipConfigure

      # Save immediately after CEF is ready, even if a later compile step fails.
      - name: Save verified minimal CEF cache
        if: steps.cef-setup.outcome == 'success' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64_minimal
          key: cef-windows-x64-minimal-154.0.34-g14c5a08-chromium-154.0.8037.98

      - name: Configure
        shell: pwsh
        run: |
          $cef = (Resolve-Path "third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64_minimal").Path
          cmake -S . -B build -G "Visual Studio 17" -A x64 "-DCEF_ROOT=$cef"

      - name: Build VEYRA and installer
        run: cmake --build build --config Release --target VEYRAInstaller --parallel

      - name: Upload VEYRA Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: VEYRA-Setup-x64
          path: build/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload VEYRA Windows build
        uses: actions/upload-artifact@v7
        with:
          name: VEYRA-windows-x64
          path: build/out/
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    if: github.actor != 'dependabot[bot]'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out smoke-test script
        uses: actions/checkout@v7

      - name: Download VEYRA build
        uses: actions/download-artifact@v7
        with:
          name: VEYRA-windows-x64
          path: package

      - name: Download VEYRA installer
        uses: actions/download-artifact@v7
        with:
          name: VEYRA-Setup-x64
          path: installer

      - name: Verify VEYRA installer install and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1 -InstallerDirectory "${{ github.workspace }}\\installer" -TestRoot "${env:RUNNER_TEMP}\\veyra-installer-test"

      - name: Launch VEYRA and capture desktop preview
        shell: powershell
        run: ./scripts/smoke-test.ps1 -PackagePath "${{ github.workspace }}\package" -ResultsPath "${{ github.workspace }}\test-results"

      - name: Upload remote preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEYRA-remote-preview
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: [build, smoke-test]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
      - name: Download packaged VEYRA build
        uses: actions/download-artifact@v7
        with:
          name: VEYRA-windows-x64
          path: VEYRA-windows-x64
      - name: Download VEYRA Windows installer
        uses: actions/download-artifact@v7
        with:
          name: VEYRA-Setup-x64
          path: VEYRA-installer
      - name: Create portable release archive
        shell: pwsh
        run: Compress-Archive -Path "VEYRA-windows-x64/*" -DestinationPath "VEYRA-windows-x64.zip" -CompressionLevel Optimal
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VEYRA_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:VEYRA_RELEASE_TAG
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+) {
            throw "Release tag must use the format vMAJOR.MINOR.PATCH."
          }
          $versionMatch = [regex]::Match((Get-Content -LiteralPath "CMakeLists.txt" -Raw), 'project\(VEYRA VERSION (?<version>\d+\.\d+\.\d+)')
          if (-not $versionMatch.Success) {
            throw "Could not read VEYRA's CMake project version."
          }
          $expectedTag = "v" + $versionMatch.Groups["version"].Value
          if ($tag -ne $expectedTag) {
            throw "Release tag $tag does not match the source version $expectedTag."
          }
          $installer = Get-ChildItem -LiteralPath "VEYRA-installer" -Filter "VEYRA-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "The VEYRA installer artifact is missing." }
          gh release create "$tag" "VEYRA-windows-x64.zip" $installer.FullName --target "$env:GITHUB_SHA" --title "VEYRA $tag" --notes "Small maintenance release to verify VEYRA's in-app updater. This build includes the 0.4.1 version bump."
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }
