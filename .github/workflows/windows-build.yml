name: Windows build

on:
  # Only browser/build changes should trigger the expensive Windows + CEF job.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - CMakeLists.txt
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
  # Validate browser changes before they are merged into main.
  pull_request:
    branches: [main]
    paths:
      - CMakeLists.txt
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
  # Use workflow_dispatch for a deliberate manual test build from a selected ref.
  workflow_dispatch:

concurrency:
  group: veyra-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Dependabot action-version PRs do not change VEYRA itself.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Restore verified minimal CEF cache
        id: cef-cache
        uses: actions/cache/restore@v5
        with:
          path: third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64_minimal
          key: cef-windows-x64-minimal-154.0.34-g14c5a08-chromium-154.0.8037.98

      - name: Download, verify, and extract minimal CEF
        id: cef-setup
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipConfigure

      # Save immediately after CEF is ready, even if a later compile step fails.
      - name: Save verified minimal CEF cache
        if: steps.cef-setup.outcome == 'success' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64_minimal
          key: cef-windows-x64-minimal-154.0.34-g14c5a08-chromium-154.0.8037.98

      - name: Configure
        shell: pwsh
        run: |
          $cef = (Resolve-Path "third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64_minimal").Path
          cmake -S . -B build -G "Visual Studio 17" -A x64 "-DCEF_ROOT=$cef"

      - name: Build VEYRA
        run: cmake --build build --config Release --target VEYRA --parallel

      - name: Upload VEYRA Windows build
        uses: actions/upload-artifact@v7
        with:
          name: VEYRA-windows-x64
          path: build/out/
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    if: github.actor != 'dependabot[bot]'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out smoke-test script
        uses: actions/checkout@v7

      - name: Download VEYRA build
        uses: actions/download-artifact@v7
        with:
          name: VEYRA-windows-x64
          path: package

      - name: Launch VEYRA and capture desktop preview
        shell: powershell
        run: ./scripts/smoke-test.ps1 -PackagePath "${{ github.workspace }}\package" -ResultsPath "${{ github.workspace }}\test-results"

      - name: Upload remote preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEYRA-remote-preview
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download packaged VEYRA build
        uses: actions/download-artifact@v7
        with:
          name: VEYRA-windows-x64
          path: VEYRA-windows-x64
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path "VEYRA-windows-x64/*" -DestinationPath "VEYRA-windows-x64.zip" -CompressionLevel Optimal
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" "VEYRA-windows-x64.zip" --verify-tag --title "VEYRA $env:GITHUB_REF_NAME" --generate-notes
