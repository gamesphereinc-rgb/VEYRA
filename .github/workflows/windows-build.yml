name: Windows build

on:
  # Only browser/build changes should trigger the expensive Windows + CEF job.
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
  # Use workflow_dispatch for a deliberate manual test build from a selected ref.
  workflow_dispatch:

concurrency:
  group: veyra-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Dependabot action-version PRs do not change VEYRA itself.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Restore verified CEF cache
        id: cef-cache
        uses: actions/cache/restore@v5
        with:
          path: third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64
          key: cef-windows-x64-154.0.34-g14c5a08-chromium-154.0.8037.98

      - name: Download and verify CEF
        id: cef-setup
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipConfigure

      # Save immediately after CEF is ready, even if a later compile step fails.
      - name: Save verified CEF cache
        if: steps.cef-setup.outcome == 'success' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64
          key: cef-windows-x64-154.0.34-g14c5a08-chromium-154.0.8037.98

      - name: Configure
        shell: pwsh
        run: |
          $cef = (Resolve-Path "third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64").Path
          cmake -S . -B build -G "Visual Studio 17" -A x64 "-DCEF_ROOT=$cef"

      - name: Build VEYRA
        run: cmake --build build --config Release --target VEYRA --parallel

      - name: Upload VEYRA Windows build
        uses: actions/upload-artifact@v7
        with:
          name: VEYRA-windows-x64
          path: build/out/
          if-no-files-found: error
          retention-days: 14
