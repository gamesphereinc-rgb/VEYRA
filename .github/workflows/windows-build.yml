name: Windows build
on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: lukka/get-cmake@latest
        name: Set up CMake
      - name: Download and verify CEF
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipConfigure
      - name: Configure
        shell: pwsh
        run: |
          $cef = (Resolve-Path "third_party/cef/cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64").Path
          cmake -S . -B build -G "Visual Studio 17" -A x64 "-DCEF_ROOT=$cef"
      - name: Build
        run: cmake --build build --config Release --target VEYRA --parallel
